name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json
      - run: npm ci
      - run: npm ci --prefix admin
      - run: npm run lint
      - run: npm test
      - run: npm run build
